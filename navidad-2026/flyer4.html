<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video en bucle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Fondo negro para rellenar los espacios vacíos */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Ajusta el video completo sin recortes ni zoom excesivo */
            pointer-events: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <video src="flyer4.mp4" autoplay muted loop playsinline></video>

</body>
</html>
